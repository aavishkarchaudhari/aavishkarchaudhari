<svg width="820" height="400" viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <defs>
    <style>
      .pill { rx: 14; ry: 14; stroke-width: 1.3; }
      .pilltext { font-size: 12.5px; font-weight: 600; }
      .label { font-size: 13.5px; fill: #9876aa; }
      .lineno { font-size: 12px; fill: #5a5a5a; text-anchor: end; }
      .code { font-size: 14px; }
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="818" height="398" rx="14" fill="#1e1f22" stroke="#33343a" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="26" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="22" r="6" fill="#27c93f"/>
  <text x="90" y="27" fill="#a9b7c6" font-size="13">TechStack.java</text>
  <line x1="0" y1="42" x2="820" y2="42" stroke="#2c2d31" stroke-width="1"/>

  <!-- line numbers + divider -->
  <line x1="66" y1="42" x2="66" y2="398" stroke="#2c2d31" stroke-width="1"/>
  <text x="55" y="90"  class="lineno">1</text>
  <text x="55" y="136" class="lineno">2</text>
  <text x="55" y="182" class="lineno">3</text>
  <text x="55" y="228" class="lineno">4</text>
  <text x="55" y="274" class="lineno">5</text>
  <text x="55" y="320" class="lineno">6</text>
  <text x="55" y="366" class="lineno">7</text>

  <!-- code line 1 -->
  <text x="90" y="90" class="code">
    <tspan fill="#cc7832">interface</tspan><tspan fill="#a9b7c6"> </tspan><tspan fill="#ffc66d">TechStack</tspan><tspan fill="#a9b7c6"> {</tspan>
  </text>

  <!-- languages -->
  <text x="90" y="136" class="label">languages:</text>
  <g transform="translate(210,116)">
    <rect class="pill" width="60"  height="28" fill="#6897bb22" stroke="#6897bb"/>
    <text x="30"  y="19" text-anchor="middle" class="pilltext" fill="#6897bb">Java</text>
    <rect class="pill" x="72"  width="100" height="28" fill="#6897bb22" stroke="#6897bb"/>
    <text x="122" y="19" text-anchor="middle" class="pilltext" fill="#6897bb">JavaScript</text>
    <rect class="pill" x="184" width="72"  height="28" fill="#6897bb22" stroke="#6897bb"/>
    <text x="220" y="19" text-anchor="middle" class="pilltext" fill="#6897bb">Python</text>
  </g>

  <!-- backend -->
  <text x="90" y="182" class="label">backend:</text>
  <g transform="translate(210,162)">
    <rect class="pill" width="110" height="28" fill="#cc783222" stroke="#cc7832"/>
    <text x="55"  y="19" text-anchor="middle" class="pilltext" fill="#cc7832">Spring Boot</text>
    <rect class="pill" x="122" width="140" height="28" fill="#cc783222" stroke="#cc7832"/>
    <text x="192" y="19" text-anchor="middle" class="pilltext" fill="#cc7832">Spring Security</text>
    <rect class="pill" x="274" width="50"  height="28" fill="#cc783222" stroke="#cc7832"/>
    <text x="299" y="19" text-anchor="middle" class="pilltext" fill="#cc7832">JWT</text>
    <rect class="pill" x="336" width="80"  height="28" fill="#cc783222" stroke="#cc7832"/>
    <text x="376" y="19" text-anchor="middle" class="pilltext" fill="#cc7832">Node.js</text>
    <rect class="pill" x="428" width="80"  height="28" fill="#cc783222" stroke="#cc7832"/>
    <text x="468" y="19" text-anchor="middle" class="pilltext" fill="#cc7832">Express</text>
  </g>

  <!-- database -->
  <text x="90" y="228" class="label">database:</text>
  <g transform="translate(210,208)">
    <rect class="pill" width="100" height="28" fill="#9876aa22" stroke="#9876aa"/>
    <text x="50"  y="19" text-anchor="middle" class="pilltext" fill="#9876aa">PostgreSQL</text>
    <rect class="pill" x="112" width="80" height="28" fill="#9876aa22" stroke="#9876aa"/>
    <text x="152" y="19" text-anchor="middle" class="pilltext" fill="#9876aa">MongoDB</text>
    <rect class="pill" x="204" width="60" height="28" fill="#9876aa22" stroke="#9876aa"/>
    <text x="234" y="19" text-anchor="middle" class="pilltext" fill="#9876aa">Redis</text>
  </g>

  <!-- frontend -->
  <text x="90" y="274" class="label">frontend:</text>
  <g transform="translate(210,254)">
    <rect class="pill" width="64" height="28" fill="#6a875922" stroke="#6a8759"/>
    <text x="32"  y="19" text-anchor="middle" class="pilltext" fill="#6a8759">React</text>
    <rect class="pill" x="76" width="80" height="28" fill="#6a875922" stroke="#6a8759"/>
    <text x="116" y="19" text-anchor="middle" class="pilltext" fill="#6a8759">Next.js</text>
    <rect class="pill" x="168" width="88" height="28" fill="#6a875922" stroke="#6a8759"/>
    <text x="212" y="19" text-anchor="middle" class="pilltext" fill="#6a8759">Tailwind</text>
  </g>

  <!-- devops -->
  <text x="90" y="320" class="label">devops:</text>
  <g transform="translate(210,300)">
    <rect class="pill" width="72" height="28" fill="#e8bf6a22" stroke="#e8bf6a"/>
    <text x="36"  y="19" text-anchor="middle" class="pilltext" fill="#e8bf6a">Docker</text>
    <rect class="pill" x="84" width="50" height="28" fill="#e8bf6a22" stroke="#e8bf6a"/>
    <text x="109" y="19" text-anchor="middle" class="pilltext" fill="#e8bf6a">Git</text>
    <rect class="pill" x="146" width="72" height="28" fill="#e8bf6a22" stroke="#e8bf6a"/>
    <text x="182" y="19" text-anchor="middle" class="pilltext" fill="#e8bf6a">GitHub</text>
  </g>

  <!-- closing brace -->
  <text x="90" y="366" class="code" fill="#a9b7c6">}</text>
</svg>
